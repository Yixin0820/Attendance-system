# 前端静态资源 + 后端 API 反向代理。
# 域名改成自己的；证书用 certbot 签发后放在 deploy/certs 下（见文档）。

# HTTP：先做 ACME 校验与跳转（还没证书时把下面整段改成直接服务即可）
server {
    listen 80;
    server_name _;

    # Let's Encrypt 校验目录；不需要时可删掉这段
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 上传的假条 / 检讨一般不大，给到 12MB 略高于后端限制
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可以长缓存；index.html 必须不缓存，否则发版后用户拿不到新页面
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 单页应用刷新子路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
