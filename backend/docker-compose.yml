# PostgreSQL 生产 / 准生产环境。
# 本地开发不需要它：默认配置走 SQLite，改 .env 里的 DATABASE_URL 即可切换。
services:
  db:
    image: postgres:17-alpine
    container_name: attendance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
